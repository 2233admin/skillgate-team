[package]
name = "skillgate-runtime"
version = "0.1.0"
description = "Structured agent launch and owned PTY runtime for Skillgate"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"

[dependencies]
portable-pty = "=0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.25.0"
