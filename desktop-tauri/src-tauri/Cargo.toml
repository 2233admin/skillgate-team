[package]
name = "skillgate-desktop"
version = "0.6.0-team.1"
description = "Skillgate desktop host"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "skillgate_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
skillgate-catalog = { path = "../../crates/skillgate-catalog" }
skillgate-files = { path = "../../crates/skillgate-files" }
skillgate-runtime = { path = "../../crates/skillgate-runtime" }
skillgate-store = { path = "../../crates/skillgate-store" }
tauri = { version = "=2.10.2", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.12.0"
time = { version = "=0.3.44", features = ["formatting"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
