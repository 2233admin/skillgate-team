name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching VERSION (for example v0.6.0-team.1)
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify version, package configuration, and release tooling
        run: |
          node --test scripts/release-tools.test.mjs
          node scripts/release-preflight.mjs --tag "$RELEASE_TAG"
      - run: bun run test
      - run: bun run gui:tauri:check
      - name: Verify Rust crates
        run: |
          cargo fmt --manifest-path desktop-tauri/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path desktop-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path desktop-tauri/src-tauri/Cargo.toml
          cargo test --manifest-path crates/skillgate-catalog/Cargo.toml
          cargo test --manifest-path crates/skillgate-files/Cargo.toml
          cargo test --manifest-path crates/skillgate-runtime/Cargo.toml
          cargo test --manifest-path crates/skillgate-store/Cargo.toml

  signing-preflight:
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Fail closed when release signing material is incomplete
        run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --require-signing

  build:
    needs: [test, signing-preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --verbose
            bundle_dir: desktop-tauri/src-tauri/target/release/bundle
          - platform: macos
            os: macos-latest
            args: --target universal-apple-darwin --verbose
            bundle_dir: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle
          - platform: linux
            os: ubuntu-22.04
            args: --verbose
            bundle_dir: desktop-tauri/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
      SKILLGATE_RELEASE_PLATFORM: ${{ matrix.platform }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Import Windows Authenticode certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "skillgate-release.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows certificate import produced no thumbprint" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Import Apple Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          KEYCHAIN_PASSWORD: temporary-ci-keychain-password
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/skillgate-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/skillgate-release.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Generate release-only updater and signing configuration
        shell: bash
        run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --write-config .release/tauri.release.conf.json
      - name: Build signed installers and update artifacts
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop-tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Skillgate ${{ env.RELEASE_TAG }}
          releaseBody: |
            Signed Skillgate desktop release for macOS, Windows, and Linux.

            This release is created as a draft. A maintainer must review checksums,
            updater metadata, and clean-machine smoke evidence before publishing it.
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: --config ../.release/tauri.release.conf.json ${{ matrix.args }}
      - name: Validate installers and write checksums
        run: node scripts/validate-release-artifacts.mjs --platform ${{ matrix.platform }} --directory ${{ matrix.bundle_dir }}
      - uses: actions/upload-artifact@v4
        with:
          name: skillgate-${{ env.RELEASE_TAG }}-${{ matrix.platform }}-evidence
          path: |
            ${{ matrix.bundle_dir }}/**
            .release/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
      - name: Attach platform checksums to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          files: .release/SHA256SUMS-${{ matrix.platform }}.txt

  verify-draft:
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download and validate updater manifest
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir release-assets
          node scripts/validate-release-artifacts.mjs --manifest release-assets/latest.json
      - name: Confirm release remains a draft
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
