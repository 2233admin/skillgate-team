name: 功能建议
description: 新功能或现有流程的改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说明**谁**在**什么场景**下需要，以及现在缺什么。
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - Team 工作流（apply / doctor / lock / 漂移）
        - CLI
        - TUI
        - Desktop
        - 技能目录 / profiles
        - 文档与上手体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      placeholder: 例如：小白不知道 Team catalog root 该填什么路径
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
      description: 不必有实现细节，描述你期望的 UX 即可
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现
        - label: 我可以帮忙验证 beta