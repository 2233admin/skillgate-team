<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-label="Skillgate Team">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="slash">
      <polygon points="0,0 720,0 640,240 0,240"/>
    </clipPath>
  </defs>

  <rect width="920" height="240" fill="#0A0A0C"/>
  <rect width="920" height="240" fill="url(#grid)"/>

  <!-- Soviet wedge -->
  <polygon points="0,0 280,0 180,240 0,240" fill="#C41E3A" fill-opacity="0.92"/>
  <polygon points="640,0 920,0 920,72 700,0" fill="#F5A524" fill-opacity="0.18"/>

  <!-- Scan band -->
  <g clip-path="url(#slash)">
    <rect x="0" y="-40" width="920" height="48" fill="url(#scan)">
      <animate attributeName="y" values="-48;260;-48" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Logo mark -->
  <g transform="translate(48, 72)">
    <path fill="none" stroke="#E7E5E4" stroke-width="3" stroke-linecap="square" d="M8 4 L2 4 L2 88 L8 88"/>
    <path fill="none" stroke="#E7E5E4" stroke-width="3" stroke-linecap="square" d="M56 4 L62 4 L62 88 L56 88"/>
    <path fill="none" stroke="#E7E5E4" stroke-width="3" d="M8 4 L56 4"/>
    <circle cx="34" cy="28" r="5" fill="#2EC4B6">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="48" r="5" fill="#F5A524">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="68" r="5" fill="#2EC4B6">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="130" y="108" fill="#E7E5E4" font-family="Segoe UI, system-ui, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.03em">Skillgate</text>
  <text x="132" y="142" fill="#F5A524" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="0.28em">TEAM OPS</text>
  <text x="130" y="172" fill="#A8A29E" font-family="Segoe UI, system-ui, sans-serif" font-size="15">一个 Git 仓库 · 全员同一套 Agent Skills</text>

  <!-- HUD chips -->
  <g transform="translate(520, 88)">
    <polygon points="0,0 200,0 188,36 0,36" fill="#141418" stroke="#2EC4B6" stroke-width="1"/>
    <text x="14" y="23" fill="#2EC4B6" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="0.12em">SYNC · APPLY</text>
  </g>
  <g transform="translate(520, 132)">
    <polygon points="0,0 220,0 208,36 0,36" fill="#141418" stroke="#F5A524" stroke-width="1"/>
    <text x="14" y="23" fill="#F5A524" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="0.12em">LOCK · DOCTOR</text>
  </g>
  <g transform="translate(520, 176)">
    <text x="0" y="0" fill="#57534E" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="0.08em">12 SKILLS / 4 AGENTS / QUANT</text>
  </g>

  <!-- Corner tick -->
  <path d="M880 200 L920 200 L920 240" fill="none" stroke="#2EC4B6" stroke-width="2"/>
  <circle cx="878" cy="202" r="3" fill="#F5A524">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>