<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Skillgate Team architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="320" rx="16" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Skillgate Team — 一条仓库，全员同一套技能</text>

  <!-- Catalog -->
  <g filter="url(#shadow)">
    <rect x="40" y="72" width="200" height="200" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="140" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">团队目录仓库</text>
    <text x="60" y="132" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">skills/</text>
    <text x="60" y="152" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">profiles/quant.yaml</text>
    <text x="60" y="172" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">skills.lock.yaml</text>
    <text x="60" y="192" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">protect.yaml</text>
    <text x="60" y="228" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">git pull → 成员同步</text>
  </g>

  <!-- Skillgate -->
  <g filter="url(#shadow)">
    <rect x="360" y="72" width="240" height="200" rx="12" fill="#172554" stroke="#3b82f6"/>
    <text x="480" y="104" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Skillgate</text>
    <text x="380" y="132" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="12">CLI · TUI · Desktop</text>
    <text x="380" y="156" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Apply profile</text>
    <text x="380" y="176" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Doctor · Lock verify</text>
    <text x="380" y="196" fill="#bfdbfe" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Catalog drift 检测</text>
    <rect x="380" y="212" width="200" height="44" rx="8" fill="#1d4ed8"/>
    <text x="480" y="239" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">team-api（三端共用）</text>
  </g>

  <!-- Agents -->
  <g filter="url(#shadow)">
    <rect x="720" y="72" width="200" height="200" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="820" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">本机 Agent</text>
    <text x="740" y="136" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">~/.claude/skills</text>
    <text x="740" y="156" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">~/.codex/skills</text>
    <text x="740" y="176" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">~/.cursor/skills</text>
    <text x="740" y="196" fill="#94a3b8" font-family="Consolas, monospace" font-size="12">~/.grok/skills</text>
    <text x="740" y="232" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11">按 profile 安装/链接</text>
  </g>

  <line x1="240" y1="172" x2="360" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="172" x2="720" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="300" y="162" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10">读取</text>
  <text x="660" y="162" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10">分发</text>
</svg>