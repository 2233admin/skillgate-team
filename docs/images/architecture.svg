<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Architecture">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#fff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="960" height="320" fill="#0A0A0C"/>
  <rect width="960" height="320" fill="url(#g)"/>
  <polygon points="0,0 320,0 260,48 0,48" fill="#C41E3A" fill-opacity="0.75"/>
  <text x="24" y="32" fill="#E7E5E4" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="0.2em">PIPELINE</text>

  <!-- Catalog - skewed panel -->
  <g transform="translate(40, 72)">
    <polygon points="0,0 200,0 188,200 0,200" fill="#141418" stroke="#2A2A30"/>
    <text x="16" y="28" fill="#F5A524" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="0.15em">01 · CATALOG</text>
    <text x="16" y="58" fill="#E7E5E4" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Team repo</text>
    <text x="16" y="88" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="11">skills/</text>
    <text x="16" y="108" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="11">profiles/quant.yaml</text>
    <text x="16" y="128" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="11">skills.lock.yaml</text>
    <text x="16" y="168" fill="#57534E" font-family="ui-monospace, Consolas, monospace" font-size="10">git pull</text>
  </g>

  <!-- Skillgate - center, cyan edge -->
  <g transform="translate(360, 64)">
    <polygon points="0,0 240,12 228,216 0,204" fill="#141418" stroke="#2EC4B6" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="216" fill="#2EC4B6" fill-opacity="0.06"/>
    <text x="20" y="36" fill="#2EC4B6" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="0.15em">02 · DISPATCH</text>
    <text x="20" y="68" fill="#E7E5E4" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">Skillgate</text>
    <text x="20" y="98" fill="#A8A29E" font-family="Segoe UI, system-ui, sans-serif" font-size="12">CLI · TUI · Desktop</text>
    <text x="20" y="124" fill="#78716C" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Apply · Doctor · Lock</text>
    <polygon points="20,148 200,158 188,188 20,178" fill="#F5A524"/>
    <text x="110" y="172" text-anchor="middle" fill="#0A0A0C" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="700">TEAM-API</text>
    <circle cx="210" cy="24" r="4" fill="#2EC4B6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Agents -->
  <g transform="translate(720, 72)">
    <polygon points="12,0 200,0 200,200 0,200" fill="#141418" stroke="#2A2A30"/>
    <text x="28" y="28" fill="#F5A524" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="0.15em">03 · LOCAL</text>
    <text x="28" y="58" fill="#E7E5E4" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">Agents</text>
    <text x="28" y="88" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="10">~/.claude/skills</text>
    <text x="28" y="106" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="10">~/.codex/skills</text>
    <text x="28" y="124" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="10">~/.cursor/skills</text>
    <text x="28" y="142" fill="#78716C" font-family="ui-monospace, Consolas, monospace" font-size="10">~/.grok/skills</text>
  </g>

  <!-- Connectors -->
  <line x1="228" y1="172" x2="360" y2="168" stroke="#2EC4B6" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="588" y1="176" x2="732" y2="172" stroke="#F5A524" stroke-width="2" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </line>

  <text x="294" y="158" fill="#57534E" font-family="ui-monospace, Consolas, monospace" font-size="9">READ</text>
  <text x="660" y="158" fill="#57534E" font-family="ui-monospace, Consolas, monospace" font-size="9">APPLY</text>
</svg>